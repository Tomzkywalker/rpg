<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3A0"/>
      <stop offset="0.35" stop-color="#FFD34E"/>
      <stop offset="0.7" stop-color="#D99616"/>
      <stop offset="1" stop-color="#7A4305"/>
    </linearGradient>
  </defs>

  <!-- dark outer silhouette -->
  <path
    d="M3 2
       L29 15
       L19 18
       L25 24
       L20 29
       L14 21
       L9 31
       Z"
    fill="#241500"
    stroke="#FFF0A6"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- golden blade -->
  <path
    d="M5.5 5
       L26 15.2
       L16.7 17
       L21.8 23.5
       L19.8 25.5
       L14.2 18.8
       L10 27.2
       Z"
    fill="url(#gold)"
    stroke="#B56C09"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- blade highlight -->
  <path
    d="M7 7
       L21 14.2
       L13.7 15.6
       L10.2 23"
    fill="none"
    stroke="#FFF8CC"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- jewel -->
  <circle
    cx="15.3"
    cy="17.4"
    r="1.8"
    fill="#FFF1A8"
    stroke="#754100"
    stroke-width="1"
  />
</svg>